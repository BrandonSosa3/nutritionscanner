[project]
name = "nutritionscanner"
version = "0.1.0"
description = "Grocery receipts to nutrition and cost intelligence"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "arq>=0.26",
    "redis>=5.2",
    "anthropic>=0.40",
    "httpx>=0.27",
    "structlog>=24.4",
    "typer>=0.15",
    "python-multipart>=0.0.17",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "asgi-lifespan>=2.1",
]

[project.scripts]
ns = "ns.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ns"]

# ── Ruff ──────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes — this app is date-critical
    "T20",       # no print()
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RUF",
]
ignore = [
    "B008",      # FastAPI Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# conftest sets environment defaults that must land before ns.config is
# imported, so its imports deliberately follow module-level statements.
"tests/conftest.py" = ["E402"]
"src/ns/cli.py" = ["T20"]           # the CLI is allowed to print
"alembic/versions/*" = ["E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["ns"]

# ── mypy ──────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["alembic.*", "arq.*"]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: requires a live Postgres (deselect with -m 'not integration')",
    "llm: makes a real Anthropic API call (deselect with -m 'not llm')",
]

[tool.coverage.run]
source = ["src/ns"]
omit = ["*/alembic/*"]
