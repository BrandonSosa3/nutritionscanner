<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- A receipt with a torn lower edge. Drawn in the neutral ink token, not a
       brand colour — the product has none. The media query lets the mark
       invert in a dark browser chrome instead of disappearing into it. -->
  <style>
    .mark { stroke: #16181a; }
    @media (prefers-color-scheme: dark) { .mark { stroke: #f2f3f4; } }
  </style>
  <g class="mark" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M8 4 H24 V25 l-3.2 2 l-3.2 -2 l-3.2 2 l-3.2 -2 l-3.2 2 Z" />
    <path d="M12 11 H20" />
    <path d="M12 16 H20" />
  </g>
</svg>
