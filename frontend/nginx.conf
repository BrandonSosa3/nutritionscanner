server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames are immutable; index.html must never be, or a
    # deploy leaves browsers holding a stale shell that references assets
    # which no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths render the shell rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
